<svg class="ta-svg" viewBox="0 0 1000 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="attachments-title attachments-description">
  <title id="attachments-title">Sending a trader pictures and documents</title>
  <desc id="attachments-description">A picture or document from the web page or Telegram is checked and stored in the trader's uploads folder; pictures go to the model with the message, and documents become text the trader reads with read_file.</desc>
  <path id="attachments-web-store" class="wire" d="M130 90 C200 90 190 130 290 130"/>
  <path id="attachments-telegram-store" class="wire" d="M130 210 C200 210 190 170 290 170"/>
  <path id="attachments-store-uploads" class="wire" d="M330 180 L330 340"/>
  <path id="attachments-store-trader" class="wire" d="M390 150 L610 150"/>
  <path id="attachments-trader-model-picture" class="wire" d="M660 135 L890 135"/>
  <path id="attachments-trader-model-text" class="wire" d="M660 165 L890 165"/>
  <path id="attachments-uploads-trader" class="wire" d="M390 350 C540 350 630 330 630 170"/>

  <text class="small" x="338" y="262">text read once,</text>
  <text class="small" x="338" y="276">labelled as data</text>
  <text class="small" x="770" y="126" text-anchor="middle">picture</text>
  <text class="small" x="770" y="184" text-anchor="middle">document text</text>
  <text class="mono" x="450" y="375">read_file uploads/…/text.txt</text>
  <text class="small" x="495" y="126" text-anchor="middle">message +</text>
  <text class="small" x="495" y="140" text-anchor="middle">a note per file</text>

  <circle class="dot" r="6"><animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.18;1" keyPoints="0;1;1"><mpath href="#attachments-web-store"/></animateMotion></circle>
  <circle class="dot" r="6"><animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2;0.34;1" keyPoints="0;0;1;1"><mpath href="#attachments-store-trader"/></animateMotion></circle>
  <circle class="dot" r="6"><animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.36;0.5;1" keyPoints="0;0;1;1"><mpath href="#attachments-trader-model-picture"/></animateMotion></circle>

  <circle class="dot alt" r="6"><animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.18;1" keyPoints="0;1;1"><mpath href="#attachments-telegram-store"/></animateMotion></circle>
  <circle class="dot alt" r="6"><animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2;0.34;1" keyPoints="0;0;1;1"><mpath href="#attachments-store-uploads"/></animateMotion></circle>
  <circle class="dot alt" r="6"><animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.55;0.72;1" keyPoints="0;0;1;1"><mpath href="#attachments-uploads-trader"/></animateMotion></circle>
  <circle class="dot alt" r="6"><animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.74;0.88;1" keyPoints="0;0;1;1"><mpath href="#attachments-trader-model-text"/></animateMotion></circle>

  <rect class="box" x="20" y="60" width="150" height="60" rx="6"/>
  <text class="title" x="95" y="86" text-anchor="middle">Web page</text>
  <text class="small" x="95" y="104" text-anchor="middle">Attach, drop or paste</text>
  <rect class="box" x="20" y="180" width="150" height="60" rx="6"/>
  <text class="title" x="95" y="206" text-anchor="middle">Telegram</text>
  <text class="small" x="95" y="224" text-anchor="middle">paired chats only</text>

  <rect class="accent-box" x="230" y="90" width="200" height="120" rx="6"/>
  <text class="title" x="330" y="118" text-anchor="middle">Attachment store</text>
  <text class="small" x="330" y="138" text-anchor="middle">checks type and 20 MB limit</text>
  <text class="small" x="330" y="154" text-anchor="middle">pictures by their contents</text>
  <text class="small" x="330" y="170" text-anchor="middle">PDF, Word, Excel, CSV, text</text>
  <text class="small" x="330" y="186" text-anchor="middle">become text</text>

  <rect class="store" x="230" y="300" width="200" height="90" rx="6"/>
  <text class="title" x="330" y="326" text-anchor="middle">Trader's uploads folder</text>
  <text class="mono" x="330" y="346" text-anchor="middle">uploads/2026-10-17/&lt;id&gt;/</text>
  <text class="mono" x="330" y="362" text-anchor="middle">report.pdf  text.txt</text>
  <text class="mono" x="330" y="378" text-anchor="middle">attachment.json</text>

  <rect class="box" x="560" y="110" width="140" height="80" rx="6"/>
  <text class="title" x="630" y="140" text-anchor="middle">Trader</text>
  <text class="small" x="630" y="158" text-anchor="middle">a file never steers;</text>
  <text class="small" x="630" y="172" text-anchor="middle">it gets its own turn</text>

  <rect class="accent-box" x="840" y="100" width="150" height="100" rx="6"/>
  <text class="title" x="915" y="130" text-anchor="middle">Model</text>
  <text class="small" x="915" y="150" text-anchor="middle">Claude: image block</text>
  <text class="small" x="915" y="166" text-anchor="middle">Qwen, Gemma: images</text>
  <text class="small" x="915" y="182" text-anchor="middle">at most 1568 pixels</text>

  <circle class="dot" r="6" cx="290" cy="440"/>
  <text class="small" x="302" y="444">a picture: the model looks at it with the message</text>
  <circle class="dot alt" r="6" cx="600" cy="440"/>
  <text class="small" x="612" y="444">a document: read as text when the trader needs it</text>
</svg>
