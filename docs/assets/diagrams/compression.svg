<svg class="ta-svg" viewBox="0 0 1000 670" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="compression-title compression-description">
  <title id="compression-title">Context compression</title>
  <desc id="compression-description">Past 70% of the context window, the desk first saves what matters in a memory-flush turn, then the conversation is summarised and the turn runs on a fresh one.</desc>
  <rect class="container" x="220" y="60" width="380" height="390" rx="10"/>
  <text class="small" x="240" y="82">Before each turn of Qwen or Gemma</text>

  <path class="wire" d="M180,300 L205,300 L205,125 L245,125"/>
  <path class="wire" d="M410,160 L410,180"/>
  <path class="wire" d="M410,250 L410,270"/>
  <path class="wire" d="M410,340 L410,360"/>
  <path class="wire" d="M575,215 L620,215 L620,205 L660,205"/>
  <path class="wire" d="M575,305 L620,305 L620,295 L660,295"/>
  <path class="wire" d="M575,395 L640,395 L640,315 L660,315"/>
  <path class="wire" d="M245,410 L200,410 L200,345 L180,345"/>

  <path id="compression-check-path" class="hidden-path" d="M180,300 L205,300 L205,125 L245,125 L410,125 L410,215 L575,215 L620,215 L620,205 L700,205"/>
  <path id="compression-summary-request-path" class="hidden-path" d="M410,305 L575,305 L620,305 L620,295 L700,295"/>
  <path id="compression-summary-path" class="hidden-path" d="M700,295 L620,295 L620,305 L575,305 L410,305 L410,395 L520,395"/>
  <path id="compression-turn-path" class="hidden-path" d="M410,395 L575,395 L640,395 L640,315 L700,315"/>
  <path id="compression-answer-path" class="hidden-path" d="M700,315 L640,315 L640,395 L575,395 L410,395 L410,410 L200,410 L200,345 L140,345"/>

  <circle class="dot" r="6"><animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.25;1" keyPoints="0;1;1"><mpath href="#compression-check-path"/></animateMotion></circle>
  <circle class="dot" r="6"><animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.27;0.38;1" keyPoints="0;0;1;1"><mpath href="#compression-summary-request-path"/></animateMotion></circle>
  <circle class="dot alt" r="6"><animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4;0.53;1" keyPoints="0;0;1;1"><mpath href="#compression-summary-path"/></animateMotion></circle>
  <circle class="dot" r="6"><animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.55;0.66;1" keyPoints="0;0;1;1"><mpath href="#compression-turn-path"/></animateMotion></circle>
  <circle class="dot alt" r="6"><animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.68;0.92;1" keyPoints="0;0;1;1"><mpath href="#compression-answer-path"/></animateMotion></circle>

  <rect class="box" x="30" y="270" width="150" height="90" rx="8"/>
  <text class="title" x="105" y="305" text-anchor="middle">Next trigger</text>
  <text class="small" x="105" y="325" text-anchor="middle">a message, a job,</text>
  <text class="small" x="105" y="340" text-anchor="middle">an alert or a fill</text>

  <rect class="accent-box" x="245" y="90" width="330" height="70" rx="6"/>
  <text class="title" x="262" y="114">1  Past 70% of the window?</text>
  <text class="small" x="262" y="134">the server's token count at the last call,</text>
  <text class="small" x="262" y="149">plus an estimate for tool results since</text>

  <rect class="box" x="245" y="180" width="330" height="70" rx="6"/>
  <text class="title" x="262" y="204">2  Memory-flush turn</text>
  <text class="small" x="262" y="224">"save what you will need": add_note and</text>
  <text class="small" x="262" y="239">Memory.md; no orders in this turn</text>

  <rect class="box" x="245" y="270" width="330" height="70" rx="6"/>
  <text class="title" x="262" y="294">3  Summarise the conversation</text>
  <text class="small" x="262" y="314">the same model, no tools, from a transcript</text>
  <text class="small" x="262" y="329">that marks shortened tool results</text>

  <rect class="box" x="245" y="360" width="330" height="70" rx="6"/>
  <text class="title" x="262" y="384">4  Run the turn on a fresh conversation</text>
  <text class="small" x="262" y="404">the summary, then the new trigger; past 85%</text>
  <text class="small" x="262" y="419">mid-turn, compress again without a flush</text>

  <rect class="store" x="660" y="170" width="310" height="70" rx="8"/>
  <text class="title" x="815" y="197" text-anchor="middle">The desk's own files</text>
  <text class="mono" x="815" y="219" text-anchor="middle">Memory.md · notes/</text>

  <rect class="box" x="660" y="260" width="310" height="80" rx="8"/>
  <text class="title" x="815" y="290" text-anchor="middle">Qwen · Gemma</text>
  <text class="small" x="815" y="310" text-anchor="middle">writes the summary, then answers</text>
  <text class="small" x="815" y="325" text-anchor="middle">the trigger in far fewer tokens</text>

  <rect class="box" x="660" y="365" width="310" height="85" rx="8"/>
  <text class="title" x="815" y="390" text-anchor="middle">Claude, the same idea</text>
  <text class="small" x="815" y="410" text-anchor="middle">at 70%: the flush turn, then Claude Code's /compact</text>
  <text class="small" x="815" y="425" text-anchor="middle">safety net: Claude Code compacts by itself at</text>
  <text class="small" x="815" y="440" text-anchor="middle">817,000 of 1,000,000 tokens</text>

  <text x="60" y="490">One 32,768-token window, as Qwen and Gemma have it</text>
  <rect class="store" x="60" y="502" width="880" height="24" rx="4"/>
  <rect x="61" y="503" width="166" height="22" class="muted-fill" fill-opacity="0.45"/>
  <rect x="227" y="503" width="49" height="22" class="dot" fill-opacity="0.35"/>
  <line class="marker" x1="676" y1="496" x2="676" y2="532" data-tone="accent"/>
  <line class="marker" x1="808" y1="496" x2="808" y2="532" data-tone="alt"/>
  <text class="small" x="62" y="546">instructions and tools: about 6,200</text>
  <text class="small" x="230" y="562">+ one candles question: about 1,600</text>
  <text class="small" x="676" y="546" text-anchor="middle">70%: flush, then summarise</text>
  <text class="small" x="808" y="562" text-anchor="middle">85%: compress mid-turn</text>

  <circle cx="230" cy="602" r="6" class="dot"/>
  <text x="244" y="602" dominant-baseline="middle">the check, the flush, a request to the model</text>
  <circle cx="590" cy="602" r="6" class="dot alt"/>
  <text x="604" y="602" dominant-baseline="middle">the summary, then the answer</text>
</svg>
