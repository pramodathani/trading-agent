<svg class="ta-svg" viewBox="0 0 1000 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="model-router-title model-router-description">
  <title id="model-router-title">The model router</title>
  <desc id="model-router-description">Each desk tries its four models in order and falls back to the next when one is unavailable; a model that said how long to wait, such as Claude until its limit resets, is skipped until then.</desc>
  <path class="wire" d="M130,80 L130,275 L290,275"/>
  <path class="wire" d="M510,275 L720,80"/>
  <path class="wire" d="M510,275 L720,210"/>
  <path class="wire" d="M510,275 L720,340"/>
  <path class="wire" d="M510,275 L720,470"/>
  <path class="wire" d="M290,330 L130,450"/>
  <path id="model-router-out-to-claude" class="hidden-path" d="M130,80 L130,275 L510,275 L740,80"/>
  <path id="model-router-claude-refuses" class="hidden-path" d="M740,80 L720,80 L510,275"/>
  <path id="model-router-out-to-deepseek" class="hidden-path" d="M510,275 L740,210"/>
  <path id="model-router-answer-back" class="hidden-path" d="M740,210 L720,210 L510,275 L400,275 L290,330 L130,450 L130,500"/>
  <circle class="dot" r="6"><animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2;1" keyPoints="0;1;1"><mpath href="#model-router-out-to-claude"/></animateMotion></circle>
  <circle class="dot alt" r="6"><animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.24;0.36;1" keyPoints="0;0;1;1"><mpath href="#model-router-claude-refuses"/></animateMotion></circle>
  <circle class="dot" r="6"><animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.38;0.5;1" keyPoints="0;0;1;1"><mpath href="#model-router-out-to-deepseek"/></animateMotion></circle>
  <circle class="dot alt" r="6"><animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.56;0.76;1" keyPoints="0;0;1;1"><mpath href="#model-router-answer-back"/></animateMotion></circle>
  <rect class="box" x="40" y="30" width="180" height="50" rx="25"/>
  <text class="title" x="130" y="52" text-anchor="middle">Trigger</text>
  <text class="small" x="130" y="70" text-anchor="middle">a message, a check, a fill</text>
  <rect class="accent-box" x="290" y="195" width="220" height="160" rx="8"/>
  <text class="title" x="400" y="222" text-anchor="middle">Model router</text>
  <text class="small" x="400" y="244" text-anchor="middle">tries the desk's models in order</text>
  <text class="small" x="400" y="266" text-anchor="middle">a failed model waits</text>
  <text class="mono" x="400" y="284" text-anchor="middle">30 s → 1 min → 5 min</text>
  <text class="small" x="400" y="304" text-anchor="middle">or as long as it said to</text>
  <text class="small" x="400" y="326" text-anchor="middle">a model taking over is told</text>
  <text class="small" x="400" y="342" text-anchor="middle">which tool calls were made</text>
  <rect class="store" x="720" y="30" width="250" height="100" rx="8"/>
  <text class="small" x="845" y="52" text-anchor="middle">1st choice</text>
  <text class="title" x="845" y="74" text-anchor="middle">Claude Opus 5.5</text>
  <text class="small" x="845" y="94" text-anchor="middle">Claude Code, Max subscription</text>
  <text class="small" x="845" y="114" text-anchor="middle">at its limit: waits until it resets</text>
  <rect class="box" x="720" y="160" width="250" height="100" rx="8"/>
  <text class="small" x="845" y="182" text-anchor="middle">2nd choice</text>
  <text class="title" x="845" y="204" text-anchor="middle">DeepSeek V4 Pro</text>
  <text class="mono" x="845" y="224" text-anchor="middle">deepseek-v4-pro, paid per token</text>
  <text class="small" x="845" y="244" text-anchor="middle">out of credit: waits 15 min</text>
  <rect class="box" x="720" y="290" width="250" height="100" rx="8"/>
  <text class="small" x="845" y="312" text-anchor="middle">3rd choice</text>
  <text class="title" x="845" y="334" text-anchor="middle">Qwen3.8 27b</text>
  <text class="mono" x="845" y="354" text-anchor="middle">qwen3.8:27b on Ollama</text>
  <text class="small" x="845" y="374" text-anchor="middle">free, on this machine</text>
  <rect class="box" x="720" y="420" width="250" height="100" rx="8"/>
  <text class="small" x="845" y="442" text-anchor="middle">4th choice</text>
  <text class="title" x="845" y="464" text-anchor="middle">Gemma 4 31b</text>
  <text class="mono" x="845" y="484" text-anchor="middle">gemma4:31b on Ollama</text>
  <text class="small" x="845" y="504" text-anchor="middle">used only if Qwen fails too</text>
  <rect class="store" x="40" y="450" width="180" height="100" rx="8"/>
  <text class="title" x="130" y="480" text-anchor="middle">Event bus</text>
  <text class="mono" x="130" y="504" text-anchor="middle">backend_unavailable</text>
  <text class="mono" x="130" y="522" text-anchor="middle">backend_switch</text>
  <text class="small question" x="560" y="140">1 try Claude first</text>
  <text class="small answer" x="440" y="180">2 limit reached</text>
  <text class="small question" x="590" y="262">3 same turn, to DeepSeek</text>
  <text class="small answer" x="250" y="400">4 the answer</text>
  <circle cx="268" cy="592" r="6" class="dot"/>
  <text x="282" y="592" dominant-baseline="middle">the turn going out</text>
  <circle cx="468" cy="592" r="6" class="dot alt"/>
  <text x="482" y="592" dominant-baseline="middle">what comes back</text>
  <text class="small" x="500" y="620" text-anchor="middle">The scalper's first choice is Claude Sonnet 5.5 at low effort instead of Opus; the rest of its order is the same.</text>
</svg>
