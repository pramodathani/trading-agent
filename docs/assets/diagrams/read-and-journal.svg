<svg class="ta-svg" viewBox="0 0 1000 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="read-and-journal-title read-and-journal-description">
  <title id="read-and-journal-title">Reading the account, and the journal</title>
  <desc id="read-and-journal-description">The broker reader reads UBI; every event is masked by the secret redactor before the journal writes it and the live stream sends it.</desc>
  <text class="small" x="40" y="40">Reading the account (read-only: no tool can place an order yet)</text>
  <text class="small" x="146" y="300">Recording every step</text>
  <path class="wire" d="M130,140 L410,140 L690,140 L910,140"/>
  <path class="wire" d="M130,140 L130,380 L410,380 L690,380 L910,380"/>
  <path class="wire" d="M690,380 L690,515"/>
  <path id="read-and-journal-read-out" class="hidden-path" d="M130,140 L410,140 L690,140 L910,140"/>
  <path id="read-and-journal-answer-back" class="hidden-path" d="M910,140 L690,140 L410,140 L130,140"/>
  <path id="read-and-journal-record" class="hidden-path" d="M130,140 L130,380 L410,380 L690,380 L910,380"/>
  <path id="read-and-journal-stream" class="hidden-path" d="M690,380 L690,515"/>
  <circle class="dot" r="6"><animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.22;1" keyPoints="0;1;1"><mpath href="#read-and-journal-read-out"/></animateMotion></circle>
  <circle class="dot alt" r="6"><animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.27;0.5;1" keyPoints="0;0;1;1"><mpath href="#read-and-journal-answer-back"/></animateMotion></circle>
  <circle class="dot" r="6"><animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.55;0.88;1" keyPoints="0;0;1;1"><mpath href="#read-and-journal-record"/></animateMotion></circle>
  <circle class="dot" r="6"><animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.74;0.88;1" keyPoints="0;0;1;1"><mpath href="#read-and-journal-stream"/></animateMotion></circle>
  <rect class="box" x="40" y="80" width="180" height="120" rx="8"/>
  <text class="title" x="130" y="108" text-anchor="middle">Desk</text>
  <text class="mono" x="130" y="132" text-anchor="middle">get_quote</text>
  <text class="mono" x="130" y="148" text-anchor="middle">get_candles</text>
  <text class="mono" x="130" y="164" text-anchor="middle">get_portfolio</text>
  <text class="mono" x="130" y="180" text-anchor="middle">get_orders</text>
  <rect class="accent-box" x="290" y="75" width="240" height="130" rx="8"/>
  <text class="title" x="410" y="103" text-anchor="middle">Broker reader</text>
  <text class="small" x="410" y="125" text-anchor="middle">one UBI call at a time, all desks</text>
  <text class="small" x="410" y="141" text-anchor="middle">in a worker thread</text>
  <text class="small" x="410" y="165" text-anchor="middle">plain Instruments, which have</text>
  <text class="small" x="410" y="181" text-anchor="middle">no order methods at all</text>
  <rect class="box" x="600" y="90" width="180" height="100" rx="8"/>
  <text class="title" x="690" y="118" text-anchor="middle">UBI</text>
  <text class="mono" x="690" y="140" text-anchor="middle">127.0.0.1:8080</text>
  <text class="small" x="690" y="162" text-anchor="middle">settings from</text>
  <text class="mono" x="690" y="178" text-anchor="middle">tradingmachine/.env</text>
  <rect class="store" x="840" y="80" width="140" height="120" rx="8"/>
  <text class="title" x="910" y="110" text-anchor="middle">10 brokers</text>
  <text class="small" x="910" y="132" text-anchor="middle">Zerodha, Dhan,</text>
  <text class="small" x="910" y="148" text-anchor="middle">Flattrade and more</text>
  <text class="mono" x="910" y="176" text-anchor="middle">₹1,53,583.08</text>
  <text class="small" x="910" y="192" text-anchor="middle">available, for example</text>
  <rect class="store" x="310" y="340" width="200" height="80" rx="8"/>
  <text class="title" x="410" y="370" text-anchor="middle">Event bus</text>
  <text class="mono" x="410" y="392" text-anchor="middle">tool_call · tool_result</text>
  <text class="small" x="410" y="408" text-anchor="middle">and every other step</text>
  <rect class="accent-box" x="600" y="330" width="180" height="100" rx="8"/>
  <text class="title" x="690" y="358" text-anchor="middle">Secret redactor</text>
  <text class="small" x="690" y="380" text-anchor="middle">known passwords and keys,</text>
  <text class="small" x="690" y="396" text-anchor="middle">and anything shaped like a token</text>
  <text class="mono" x="690" y="418" text-anchor="middle">→ [redacted]</text>
  <rect class="store" x="840" y="320" width="140" height="120" rx="8"/>
  <text class="title" x="910" y="350" text-anchor="middle">Trade journal</text>
  <text class="small" x="910" y="372" text-anchor="middle">one file per desk</text>
  <text class="small" x="910" y="388" text-anchor="middle">per India date,</text>
  <text class="small" x="910" y="404" text-anchor="middle">lines only added</text>
  <text class="mono" x="910" y="426" text-anchor="middle">2026-10-17.jsonl</text>
  <rect class="box" x="600" y="490" width="180" height="56" rx="8"/>
  <text class="title" x="690" y="514" text-anchor="middle">Live event stream</text>
  <text class="small" x="690" y="534" text-anchor="middle">for the web interface</text>
  <text class="small question" x="545" y="128">read request</text>
  <text class="small answer" x="545" y="162">the answer</text>
  <circle cx="268" cy="590" r="6" class="dot"/>
  <text x="282" y="590" dominant-baseline="middle">requests and records going out</text>
  <circle cx="548" cy="590" r="6" class="dot alt"/>
  <text x="562" y="590" dominant-baseline="middle">answers coming back</text>
  <text class="small" x="500" y="618" text-anchor="middle">In the live test the journal held 25 events and 0 of 5 real secret values.</text>
</svg>
