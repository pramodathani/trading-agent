<svg class="ta-svg" viewBox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="request-flow-title request-flow-description">
  <title id="request-flow-title">A message to a desk and its answer</title>
  <desc id="request-flow-description">You send a message over HTTP; the gateway checks the token, queues a trigger for the desk, the desk runs the turn, and every step is published on the event bus and streamed back over the WebSocket.</desc>
  <rect class="container" x="222" y="88" width="490" height="478" rx="10"/>
  <text class="small" x="252" y="110">trading-agent gateway: one process, uvicorn on 127.0.0.1:8120</text>
  <path class="wire" d="M610,40 L690,40 L690,148"/>
  <path class="wire" d="M690,148 L690,540 L243,540 L243,40 L320,40"/>
  <path class="wire" d="M675,148 L690,148"/>
  <path class="wire" d="M675,218 L690,218"/>
  <path class="wire" d="M675,288 L690,288"/>
  <path class="wire" d="M675,358 L690,358"/>
  <path class="wire" d="M675,428 L690,428"/>
  <path class="wire" d="M675,498 L690,498"/>
  <path class="wire" d="M690,428 L760,440"/>
  <path id="request-flow-request-path" class="hidden-path" d="M465,40 L610,40 L690,40 L690,148 L690,218 L690,288 L690,358 L600,358"/>
  <path id="request-flow-answer-path" class="hidden-path" d="M600,428 L690,428 L690,498 L690,540 L243,540 L243,40 L320,40 L465,40"/>
  <path id="request-flow-listener-path" class="hidden-path" d="M600,428 L690,428 L760,440 L865,455"/>
  <circle class="dot" r="6"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4;1" keyPoints="0;1;1"><mpath href="#request-flow-request-path"/></animateMotion></circle>
  <circle class="dot alt" r="6"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.45;0.95;1" keyPoints="0;0;1;1"><mpath href="#request-flow-answer-path"/></animateMotion></circle>
  <circle class="dot alt" r="6"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.45;0.62;1" keyPoints="0;0;1;1"><mpath href="#request-flow-listener-path"/></animateMotion></circle>
  <rect class="box" x="255" y="120" width="420" height="56" rx="6"/>
  <text class="title" x="272" y="143">1  Check the access token</text>
  <text class="small" x="272" y="163">wrong or missing token → 401 · desk that does not exist → 404</text>
  <rect class="box" x="255" y="190" width="420" height="56" rx="6"/>
  <text class="title" x="272" y="213">2  Queue a trigger for desk "main"</text>
  <text class="small" x="272" y="233">the POST returns at once: 202 and the new trigger_id</text>
  <rect class="accent-box" x="255" y="260" width="420" height="56" rx="6"/>
  <text class="title" x="272" y="283">3  The desk takes its next trigger</text>
  <text class="small" x="272" y="303">one turn at a time; every desk has its own queue</text>
  <rect class="box" x="255" y="330" width="420" height="56" rx="6"/>
  <text class="title" x="272" y="353">4  Run the turn</text>
  <text class="small" x="272" y="373">its model answers, calling tools as it needs</text>
  <rect class="box" x="255" y="400" width="420" height="56" rx="6"/>
  <text class="title" x="272" y="423">5  Publish events on the event bus</text>
  <text class="mono" x="272" y="443">trigger_received · turn_started · text · turn_finished</text>
  <rect class="box" x="255" y="470" width="420" height="56" rx="6"/>
  <text class="title" x="272" y="493">6  Stream them over the WebSocket</text>
  <text class="small" x="272" y="513">/ws/events notices when you hang up; the token is hidden in logs</text>
  <rect class="box" x="320" y="12" width="290" height="56" rx="28"/>
  <text class="title" x="465" y="36" text-anchor="middle">You</text>
  <text class="mono" x="465" y="55" text-anchor="middle">POST /api/desks/main/messages</text>
  <text class="small answer" x="30" y="28">events arrive live, as JSON:</text>
  <text class="mono answer" x="30" y="46">trigger_received</text>
  <text class="mono answer" x="30" y="62">turn_started</text>
  <text class="mono answer" x="30" y="78">text (the reply)</text>
  <text class="mono answer" x="30" y="94">turn_finished</text>
  <rect class="store" x="760" y="380" width="210" height="140" rx="8"/>
  <text class="title" x="865" y="412" text-anchor="middle">Other listeners</text>
  <text class="small" x="865" y="434" text-anchor="middle">each gets its own queue</text>
  <text class="small" x="865" y="480" text-anchor="middle">the journal, the web</text>
  <text class="small" x="865" y="496" text-anchor="middle">page, Telegram, hooks</text>
  <rect class="store" x="760" y="130" width="210" height="150" rx="8"/>
  <text class="title" x="865" y="162" text-anchor="middle">Outside the flow</text>
  <text class="mono" x="865" y="190" text-anchor="middle">trading_agent.toml</text>
  <text class="small" x="865" y="206" text-anchor="middle">checked at start, typos rejected</text>
  <text class="mono" x="865" y="236" text-anchor="middle">trading-agent doctor</text>
  <text class="small" x="865" y="252" text-anchor="middle">8 checks of this machine</text>
  <circle cx="268" cy="598" r="6" class="dot"/>
  <text x="282" y="602">your message going in</text>
  <circle cx="468" cy="598" r="6" class="dot alt"/>
  <text x="482" y="602">events coming back out</text>
  <text class="small" x="500" y="632" text-anchor="middle">The POST and the WebSocket are separate connections: the reply is never the POST's answer, it arrives as events.</text>
</svg>
