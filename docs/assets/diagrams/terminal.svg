<svg class="ta-svg" viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="terminal-title terminal-description">
  <title id="terminal-title">The terminal program and the gateway</title>
  <desc id="terminal-description">The terminal program reads today's journal once, sends messages and answers through the API with the token, and receives every event over one live connection, exactly as the web page does.</desc>
  <rect class="group" x="370" y="40" width="240" height="420" rx="10"/>
  <text class="small" x="490" y="60" text-anchor="middle">the gateway, port 8120</text>

  <path class="wire" d="M280,130 L400,130"/>
  <path class="wire" d="M580,130 L620,130 L620,310 L700,310"/>
  <path class="wire" d="M280,205 L400,205"/>
  <path class="wire" d="M580,205 L650,205 L650,140 L700,140"/>
  <path class="wire" d="M280,280 L400,280"/>
  <path class="wire" d="M580,280 L670,280 L670,200 L700,200"/>
  <path class="wire" d="M970,175 L985,175 L985,405 L580,405"/>
  <path class="wire" d="M400,405 L280,405"/>
  <text class="small" x="290" y="121">today's journal</text>
  <text class="small" x="290" y="196">a message</text>
  <text class="small" x="290" y="271">an answer</text>
  <text class="small" x="290" y="396">live events</text>

  <path id="terminal-journal" class="hidden-path" d="M160,130 L280,130 L400,130 L580,130 L620,130 L620,310 L700,310 L835,310"/>
  <path id="terminal-message" class="hidden-path" d="M160,205 L280,205 L400,205 L580,205 L650,205 L650,140 L700,140 L835,140"/>
  <path id="terminal-answer" class="hidden-path" d="M160,280 L280,280 L400,280 L580,280 L670,280 L670,200 L700,200 L835,200"/>
  <path id="terminal-event" class="hidden-path" d="M835,175 L970,175 L985,175 L985,405 L580,405 L400,405 L280,405 L160,405"/>

  <circle class="dot" r="6"><animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.16;1" keyPoints="0;1;1"><mpath href="#terminal-journal"/></animateMotion></circle>
  <circle class="dot" r="6"><animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2;0.38;1" keyPoints="0;0;1;1"><mpath href="#terminal-message"/></animateMotion></circle>
  <circle class="dot alt" r="6"><animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.42;0.62;1" keyPoints="0;0;1;1"><mpath href="#terminal-event"/></animateMotion></circle>
  <circle class="dot" r="6"><animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.66;0.84;1" keyPoints="0;0;1;1"><mpath href="#terminal-answer"/></animateMotion></circle>
  <circle class="dot alt" r="6"><animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.86;0.99;1" keyPoints="0;0;1;1"><mpath href="#terminal-event"/></animateMotion></circle>

  <rect class="accent-box" x="30" y="70" width="250" height="380" rx="8"/>
  <text class="title" x="155" y="98" text-anchor="middle">Your terminal</text>
  <text class="mono" x="155" y="116" text-anchor="middle">bin/trading-agent</text>
  <text x="55" y="160">Chat</text>
  <text class="small" x="120" y="160">turns, tool runs, pictures</text>
  <text x="55" y="235">Request dock</text>
  <text class="small" x="55" y="252">questions, plans, permissions</text>
  <text x="55" y="320">Side panel</text>
  <text class="small" x="55" y="337">trader, model, context, funds</text>
  <text x="55" y="365">Pages</text>
  <text class="small" x="120" y="365">/trading, /schedule …</text>
  <text class="small" x="155" y="435" text-anchor="middle">the token comes from .env</text>

  <rect class="box" x="400" y="105" width="180" height="200" rx="8"/>
  <text class="title" x="490" y="130" text-anchor="middle">API</text>
  <text class="small" x="490" y="150" text-anchor="middle">every request shows</text>
  <text class="small" x="490" y="164" text-anchor="middle">the token, and names</text>
  <text class="small" x="490" y="178" text-anchor="middle">the terminal as the client</text>
  <text class="mono" x="490" y="230" text-anchor="middle">/api/traders/…</text>
  <text class="mono" x="490" y="250" text-anchor="middle">/api/requests/…</text>

  <rect class="box" x="400" y="380" width="180" height="55" rx="8"/>
  <text class="title" x="490" y="403" text-anchor="middle">Live events</text>
  <text class="mono" x="490" y="421" text-anchor="middle">/ws/events</text>

  <rect class="box" x="700" y="100" width="270" height="130" rx="8"/>
  <text class="title" x="835" y="126" text-anchor="middle">The traders</text>
  <text class="small" x="835" y="148" text-anchor="middle">general, intraday, scalper, positional</text>
  <text class="small" x="835" y="166" text-anchor="middle">a busy trader takes a message</text>
  <text class="small" x="835" y="181" text-anchor="middle">at its next tool call</text>

  <rect class="store" x="700" y="270" width="270" height="80" rx="8"/>
  <text class="title" x="835" y="300" text-anchor="middle">Journal</text>
  <text class="small" x="835" y="320" text-anchor="middle">every event today, so the chat opens</text>
  <text class="small" x="835" y="334" text-anchor="middle">with the day's turns already in it</text>

  <circle cx="220" cy="505" r="6" class="dot"/>
  <text x="234" y="505" dominant-baseline="middle">a request from the terminal</text>
  <circle cx="530" cy="505" r="6" class="dot alt"/>
  <text x="544" y="505" dominant-baseline="middle">a live event coming back</text>
</svg>
