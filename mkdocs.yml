site_name: trading-agent
site_description: An always-on, multi-desk AI trading agent on tradingmachine and UBI - four desks with their own personas, models and memory, and one risk engine between them and the market.
site_author: Pramod Athani
copyright: Copyright &copy; Pramod Athani
site_url: https://pramodathani.github.io/trading-agent/
repo_url: https://github.com/pramodathani/trading-agent
repo_name: pramodathani/trading-agent
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  icon:
    logo: material/robot-outline
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow the system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/vega@5
  - https://cdn.jsdelivr.net/npm/vega-lite@5
  - https://cdn.jsdelivr.net/npm/vega-embed@6

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: vegalite
          class: vegalite
          format: !!python/name:mkdocs_charts_plugin.fences.fence_vegalite
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde

plugins:
  - search
  - charts:
      vega_theme_light: default
      vega_theme_dark: dark
  - gen-files:
      scripts:
        - scripts/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_section_style: table
            docstring_options:
              returns_named_value: false
              warn_unknown_params: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_source: true
            show_if_no_docstring: false
            inherited_members: false
            members_order: source
            group_by_category: false
            filters: ["!^_[^_]"]
            merge_init_into_class: true
            separate_signature: true
            signature_crossrefs: true
            line_length: 96
            heading_level: 2

watch:
  - src

nav:
  - Home: index.md
  - Get started:
      - get-started/index.md
      - Installation: get-started/installation.md
      - Configuration: get-started/configuration.md
      - First run: get-started/first-run.md
      - The service: get-started/service.md
  - Using it:
      - using/index.md
      - The web page: using/web-page.md
      - Talking to a desk: using/chat.md
      - Telegram: telegram_setup.md
      - Going live: going_live.md
      - Commands: using/commands.md
  - Desks and risk:
      - desks/index.md
      - Your files: desks/your-files.md
      - The risk engine: desks/risk-engine.md
      - Orders: desks/orders.md
  - The agent:
      - agent/index.md
      - Models: agent/models.md
      - Tools: agent/tools.md
      - Memory: agent/memory.md
      - Skills: agent/skills.md
      - Subagents: agent/subagents.md
      - Scheduling and watching: agent/scheduling.md
      - Extensions: agent/extensions.md
  - Architecture:
      - architecture/index.md
      - Gateway API: architecture/gateway-api.md
      - Security: architecture/security.md
      - Design choices: architecture/design-choices.md
  - Project:
      - project/index.md
      - Repository structure: project/structure.md
      - Tests: project/tests.md
      - Writing these docs: project/writing-docs.md
  - API reference: reference/
