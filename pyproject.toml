[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "trading-agent"
version = "0.1.0"
description = "An always-on, multi-desk AI trading agent built on tradingmachine."
requires-python = ">=3.14"
dependencies = [
    "claude-agent-sdk==0.2.168",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "ollama==0.6.3",
    "openai==3.31.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    "trafilatura==2.3.1",
    "uvicorn[standard]==0.53.0",
    "websockets==17.2",
]

[project.optional-dependencies]
development = [
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/trading_agent",
]
