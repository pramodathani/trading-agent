[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "trading-agent"
version = "0.1.0"
description = "An always-on, multi-desk AI trading agent built on tradingmachine."
requires-python = ">=3.14"
dependencies = [
    "claude-agent-sdk==0.2.168",
    "croniter==6.2.4",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "ollama==0.6.3",
    "openai==3.31.0",
    "openpyxl==3.1.5",
    "pillow==12.3.0",
    "playwright==1.64.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pypdf==6.21.1",
    "python-docx==1.2.0",
    "python-dotenv==1.2.3",
    "python-multipart==0.0.32",
    "python-telegram-bot==22.8",
    "textual==8.2.8",
    "pyyaml==6.0.3",
    "trafilatura==2.3.1",
    "uvicorn[standard]==0.53.0",
    "websockets==17.2",
]

[project.optional-dependencies]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-charts-plugin==0.0.13",
    "mkdocs-gen-files==0.5.0",
    "mkdocs-literate-nav==0.6.2",
    "mkdocs-material==9.6.9",
    "mkdocs-section-index==0.3.9",
    "mkdocstrings[python]==0.29.0",
    "pymdown-extensions==10.21.3",
]
development = [
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/trading_agent",
]
