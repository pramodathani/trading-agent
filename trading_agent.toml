mode = "dry_run"
tradingmachine_environment_file = "/home/pramod/Projects/tradingmachine/.env"
market_calendar_directory = "/home/pramod/Projects/unified_broker_interface/stock_brokers/instruments/ticks/utilities/calendars"

[gateway]
host = "127.0.0.1"
port = 8120

[[desks]]
name = "main"
backend_order = [
    "claude",
    "qwen",
    "gemma",
]

[[desks]]
name = "intraday"
backend_order = [
    "claude",
    "qwen",
    "gemma",
]
heartbeat_minutes = 10
scheduled_checks = [
    "09:05",
    "15:05",
    "15:35",
]

[[desks]]
name = "scalper"
backend_order = [
    "qwen",
    "gemma",
    "claude",
]
heartbeat_minutes = 2
scheduled_checks = [
    "09:10",
    "15:05",
]

[[desks]]
name = "positional"
backend_order = [
    "claude",
    "qwen",
    "gemma",
]
scheduled_checks = [
    "08:45",
    "12:30",
    "15:40",
]

[backends.gemma]
kind = "ollama"
base_url = "http://127.0.0.1:11434"
model = "gemma4:31b"
context_window = 32768

[backends.qwen]
kind = "ollama"
base_url = "http://127.0.0.1:11434"
model = "qwen3.8:27b"
context_window = 32768

[backends.claude]
kind = "claude_code"
model = "opus"
context_window = 1000000

[telegram]
enabled = true
default_desk = "main"

[approvals]
tools = [
    "flatten_desk",
]
expiry_minutes = 5
