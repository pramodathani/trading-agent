mode = "live"
tradingmachine_environment_file = "/home/pramod/Projects/tradingmachine/.env"
market_calendar_directory = "/home/pramod/Projects/unified_broker_interface/stock_brokers/instruments/ticks/utilities/calendars"

[gateway]
host = "127.0.0.1"
port = 8120
allowed_origins = [
    "https://localhost",
]

[traders]
backend_order = [
    "claude",
    "deepseek",
    "qwen",
    "gemma",
]
sleep_after_minutes = 30

[backends.gemma]
kind = "ollama"
base_url = "http://127.0.0.1:11434"
model = "gemma4:31b"
context_window = 32768

[backends.qwen]
kind = "ollama"
base_url = "http://127.0.0.1:11434"
model = "qwen3.8:27b"
context_window = 32768

[backends.claude]
kind = "claude_code"
model = "opus"
effort = "medium"
context_window = 1000000
other_models = [
    "claude-fable-5-1",
    "claude-sonnet-5-5",
    "claude-haiku-5-5",
]

[backends.claude_sonnet]
kind = "claude_code"
model = "sonnet"
effort = "low"
context_window = 200000
other_models = [
    "claude-opus-5-5",
    "claude-fable-5-1",
    "claude-haiku-5-5",
]

[backends.deepseek]
kind = "deepseek"
base_url = "https://api.deepseek.com"
model = "deepseek-v4-pro"
context_window = 1000000
api_key_variable = "DEEPSEEK_API_KEY"
vision = false
other_models = [
    "deepseek-flash",
]
usd_per_million_cache_hit_tokens = 0.044
usd_per_million_cache_miss_tokens = 1.32
usd_per_million_completion_tokens = 3.96
peak_hours_utc = [
    "01:00-04:00",
    "06:00-10:00",
]
off_peak_price_factor = 0.5

[push]
enabled = true

[telegram]
enabled = true
default_trader = "general"

[approvals]
tools = [
    "flatten_trader",
]
expiry_minutes = 5
